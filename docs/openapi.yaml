# Ezermalas pieteikumu sistēma · iesniegumu API · līgums v0
# Līgumu maina analītiķis. Katra izmaiņa: atsevišķs komits ar pieteikuma ID.

openapi: 3.0.3
info:
  title: Ezermalas pieteikumu sistēma · iesniegumu API
  version: 0.1.0
  description: |
    Iedzīvotāju iesniegumu pieņemšana un apskate.

    Šis līgums ir analītiķa artefakts un patiesības avots (source of truth).
    Ja programma atbild citādi, nekā rakstīts šeit, tā ir kļūda programmā
    vai līgumā, un par to jālemj.

    > Noteikumi vienkāršoti mācību vajadzībām. Ezermalas novada pašvaldība
    > un OMD reģistrs ir izdomāti. Visi dati ir sintētiski.
servers:
  - url: http://localhost:8000
    description: Lokālais prototips (Codespace)
tags:
  - name: Iesniegumi
    description: Iesnieguma pieņemšana un apskate (R1–R3)
  - name: Sistēma
    description: Tehniskie galapunkti (R4)
  - name: Autentifikācija
    description: |
      CRM reģistrēšanās, pieslēgšanās un atteikšanās (F0, CR-4).
      Sesija ir parakstīta sīkdatne `crm_sesija` (8 h, `HttpOnly`, `SameSite=Lax`).
      Katru `POST` var sūtīt kā JSON vai kā HTML formu
      (`application/x-www-form-urlencoded`); formai atbilde ir HTML lapa vai 303 novirzīšana.
  - name: Lomas
    description: |
      Lomas `darbinieks` un `vaditajs` (N3, CR-5). Lomu nolasa no datubāzes
      katrā pieprasījumā, tāpēc izmaiņa stājas spēkā nākamajā pieprasījumā.

paths:
  /health:
    get:
      tags: [Sistēma]
      operationId: getHealth
      summary: Vai serviss darbojas
      responses:
        '200':
          description: Serviss darbojas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /submissions:
    post:
      tags: [Iesniegumi]
      operationId: createSubmission
      summary: Iesniegt iesniegumu
      description: |
        Pieņem iesniegumu, piešķir ID, statusu `RECEIVED`, saņemšanas laiku
        un atbildes termiņu.

        **Atbildes kanāls (CR-2).** Pēc saņemšanas sistēma pārbauda
        iesniedzēja oficiālo e-adresi OMD reģistrā un nosaka `replyChannel`:
        - OMD `ACTIVE` → `E_ADDRESS`, neatkarīgi no `preferredChannel`.
        - OMD `NOT_ACTIVATED` → `preferredChannel`. Ja izvēlēts `E_ADDRESS`,
          bet e-adrese nav aktivizēta: `EMAIL`, un `reasonCode` norāda iemeslu.
        - OMD 404 (reģistrā nav ieraksta) → tāpat kā `NOT_ACTIVATED`.

        *CR-2 daļa nav pabeigta: skatīt `tracker/CR-2.md` un A1.*
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreate'
            example:
              personalCode: '32000000001'
              fullName: Līga Ozoliņa-Kalniņa
              email: liga@example.com
              preferredChannel: EMAIL
              topic: ROADS
              subject: Bedre Ezera ielā
              body: Pie Ezera ielas 12 ir liela bedre. Lūdzu, salabojiet to.
      responses:
        '201':
          description: Iesniegums pieņemts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionCreated'
        '400':
          $ref: '#/components/responses/ValidationError'

  /submissions/{id}:
    get:
      tags: [Iesniegumi]
      operationId: getSubmission
      summary: Iesniegums pēc ID
      description: Darbinieks atver vienu iesniegumu pēc tā ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Iesnieguma ID
          schema:
            type: string
            example: IES-2026-000123
      responses:
        '200':
          description: Iesniegums atrasts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/register:
    post:
      tags: [Autentifikācija]
      operationId: registerUser
      summary: Reģistrēt CRM lietotāju (CR-4)
      description: |
        Izveido kontu. E-pastu glabā mazajiem burtiem; e-pasts ir unikāls
        neatkarīgi no lielajiem/mazajiem burtiem. Paroli glabā tikai kā
        sāļotu PBKDF2-SHA256 jaucējvērtību, atbildē tā netiek atgriezta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registracija'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Registracija'
      responses:
        '201':
          description: Konts izveidots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lietotajs'
        '303':
          description: (HTML forma) Konts izveidots, novirza uz `/auth/login?registrets=1`
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ResursNavAtrasts'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /auth/login:
    post:
      tags: [Autentifikācija]
      operationId: loginUser
      summary: Pieslēgties (CR-4)
      description: |
        Pārbauda e-pastu un paroli un izveido sesiju. Nepareizai parolei un
        nezināmam e-pastam atbilde ir vienāda.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pieslegsanas'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Pieslegsanas'
      responses:
        '200':
          description: Pieslēgts; atbildē ir sesijas sīkdatne `crm_sesija`
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PieslegsanasAtbilde'
        '303':
          description: (HTML forma) Pieslēgts, novirza uz `/panelis` (F9.1)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResursNavAtrasts'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /auth/logout:
    post:
      tags: [Autentifikācija]
      operationId: logoutUser
      summary: Atslēgties (CR-4)
      description: Dzēš sesiju. Darbojas arī bez aktīvas sesijas.
      responses:
        '204':
          description: Sesija dzēsta
        '303':
          description: (HTML forma) Sesija dzēsta, novirza uz `/auth/login`
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ResursNavAtrasts'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /lietotaji/{id}/loma:
    patch:
      tags: [Lomas]
      operationId: changeUserRole
      summary: Mainīt lietotāja lomu (CR-5, tikai vadītājs)
      description: |
        Jauns lietotājs vienmēr ir `darbinieks`. Lomu maina tikai vadītājs.
        Ja izmaiņas rezultātā sistēmā nepaliktu neviena vadītāja — 409.
      security:
        - sesija: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LomasMaina'
      responses:
        '200':
          description: Loma mainīta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lietotajs'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResursNavAtrasts'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '5XX':
          $ref: '#/components/responses/ServerError'

  /macibu-rezims/loma:
    post:
      tags: [Lomas]
      operationId: switchOwnRole
      summary: Pārslēgt savu lomu mācību režīmā (CR-5, F9.12)
      description: |
        Pieejams tikai, ja serverim iestatīts `CRM_MACIBU_REZIMS=1`; citādi 403.
        Ļauj izmēģināt abu lomu skatus.
      security:
        - sesija: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LomasMaina'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LomasMaina'
      responses:
        '200':
          description: Loma pārslēgta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lietotajs'
        '303':
          description: (HTML forma) Loma pārslēgta, novirza uz `/panelis`
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResursNavAtrasts'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '5XX':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    sesija:
      type: apiKey
      in: cookie
      name: crm_sesija
      description: Sesijas sīkdatne pēc `POST /auth/login` (CR-4)

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 0.1.0

    SubmissionCreate:
      type: object
      required:
        - personalCode
        - fullName
        - email
        - preferredChannel
        - topic
        - subject
        - body
      properties:
        personalCode:
          type: string
          description: Iesniedzēja personas kods
          example: '32000000001'
        fullName:
          type: string
          description: Iesniedzēja vārds un uzvārds
          example: Jānis Bērziņš
        email:
          type: string
          format: email
          description: Iesniedzēja e-pasts
          example: janis@example.com
        preferredChannel:
          $ref: '#/components/schemas/PreferredChannel'
        topic:
          $ref: '#/components/schemas/Topic'
        subject:
          type: string
          description: Iesnieguma temats
          example: Bedre Ezera ielā
        body:
          type: string
          description: Iesnieguma teksts
          example: Pie Ezera ielas 12 ir liela bedre. Lūdzu, salabojiet to.

    SubmissionCreated:
      type: object
      required: [id, status, receivedAt, dueDate, replyChannel]
      properties:
        id:
          type: string
          description: Iesnieguma ID
          example: IES-2026-000123
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        receivedAt:
          type: string
          format: date-time
          description: Saņemšanas laiks
          example: '2026-10-01T09:15:00Z'
        dueDate:
          type: string
          description: Atbildes termiņš
          example: '2026-11-02'
        replyChannel:
          $ref: '#/components/schemas/ReplyChannel'
        reasonCode:
          type: string
          nullable: true
          description: |
            Kāpēc `replyChannel` atšķiras no `preferredChannel`.
            `null`, ja kanāls sakrīt. *CR-2: vērtību saraksts nav pabeigts.*
          example: E_ADDRESS_NOT_ACTIVE

    Submission:
      description: Pilns iesnieguma ieraksts
      allOf:
        - $ref: '#/components/schemas/SubmissionCreated'
        - $ref: '#/components/schemas/SubmissionCreate'

    PreferredChannel:
      type: string
      description: Kā iesniedzējs vēlas saņemt atbildi
      enum: [EMAIL, POST, E_ADDRESS]
      example: EMAIL

    ReplyChannel:
      type: string
      description: |
        Kanāls, pa kuru sūtīs atbildi (nosaka sistēma, CR-2).
        *CR-2: vērtību saraksts nav pabeigts.*
      enum: [EMAIL, POST, E_ADDRESS]
      example: E_ADDRESS

    Topic:
      type: string
      description: |
        Iesnieguma tēma:
        `ROADS` Ceļi un ielas · `WASTE` Atkritumi ·
        `PLANNING` Teritorijas plānošana · `OTHER` Cits
      enum: [ROADS, WASTE, PLANNING, OTHER]
      example: ROADS

    SubmissionStatus:
      type: string
      description: Iesnieguma statuss. Jauns iesniegums vienmēr ir `RECEIVED`.
      enum: [RECEIVED, IN_PROGRESS, FORWARDED, ANSWERED, WITHDRAWN]
      example: RECEIVED

    Lietotajs:
      type: object
      description: CRM lietotājs (CR-4)
      required: [id, vards, epasts, loma]
      properties:
        id:
          type: integer
          example: 1
        vards:
          type: string
          example: Anna Paraugs
        epasts:
          type: string
          format: email
          example: anna@example.com
        loma:
          $ref: '#/components/schemas/Loma'

    Loma:
      type: string
      description: Lietotāja loma (N3, CR-5)
      enum: [darbinieks, vaditajs]
      example: darbinieks

    LomasMaina:
      type: object
      required: [loma]
      properties:
        loma:
          $ref: '#/components/schemas/Loma'

    Registracija:
      type: object
      required: [vards, epasts, parole]
      properties:
        vards:
          type: string
          minLength: 1
          maxLength: 100
          example: Anna Paraugs
        epasts:
          type: string
          format: email
          maxLength: 254
          example: anna@example.com
        parole:
          type: string
          format: password
          minLength: 12
          maxLength: 256

    Pieslegsanas:
      type: object
      required: [epasts, parole]
      properties:
        epasts:
          type: string
          format: email
          example: anna@example.com
        parole:
          type: string
          format: password

    PieslegsanasAtbilde:
      type: object
      required: [lietotajs]
      properties:
        lietotajs:
          $ref: '#/components/schemas/Lietotajs'

    Error:
      type: object
      description: Vienota kļūdu shēma visiem galapunktiem
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Kļūdas kods, piemēram, `VALIDATION_ERROR` vai `NOT_FOUND`
              example: VALIDATION_ERROR
            message:
              type: string
              description: Cilvēkam lasāms apraksts. Bez personas datiem.
              example: Request validation failed
            details:
              type: array
              description: Katra lauka kļūda atsevišķi (tikai `VALIDATION_ERROR`)
              items:
                type: object
                required: [field, issue]
                properties:
                  field:
                    type: string
                    example: personalCode
                  issue:
                    type: string
                    example: INVALID_FORMAT

  responses:
    BadRequest:
      description: Pieprasījuma ķermenis nav derīgs JSON objekts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: BAD_REQUEST
              message: Pieprasījuma ķermenis nav derīgs JSON
    Unauthorized:
      description: Nav pieslēgts vai nepareizi pieslēgšanās dati. HTML pieprasījumu novirza uz `/auth/login` (303).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: Nepieciešama pieslēgšanās
    Forbidden:
      description: Lietotāja lomai vai piederībai šī darbība nav atļauta
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: Darbība nav atļauta
    ResursNavAtrasts:
      description: Resurss nav atrasts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Nav atrasts
    Conflict:
      description: Konflikts ar esošiem datiem
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: CONFLICT
              message: Lietotājs ar šo e-pastu jau ir reģistrēts
    ValidationFailed:
      description: Lauku vērtības nav derīgas. Dati netiek saglabāti.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Ievades dati nav derīgi
              details:
                - field: parole
                  issue: TOO_SHORT
    ServerError:
      description: Servera kļūda
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: Servera kļūda
    ValidationError:
      description: Kļūdains pieprasījums. Iesniegums netiek saglabāts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: personalCode
                  issue: INVALID_FORMAT
    NotFound:
      description: Iesniegums ar šādu ID nav atrasts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Submission not found
